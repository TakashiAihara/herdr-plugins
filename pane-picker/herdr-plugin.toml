id = "takashiaihara.pane-picker"
name = "Pane picker"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Jump to a pane from a popup that searches every pane field and sorts, groups and reorders the list"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/fetch-or-build.sh"]

[[actions]]
id = "open"
title = "Pick a pane"
command = ["target/release/pane-picker", "open"]

[[panes]]
id = "picker"
title = "Pane picker"
placement = "popup"
width = "80%"
height = "70%"
command = ["target/release/pane-picker", "ui"]

[[startup]]
command = ["target/release/pane-picker", "restore"]
