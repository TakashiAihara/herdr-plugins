name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and unit-test agent-search
        working-directory: agent-search
        run: |
          cargo fmt --check
          cargo build --release --locked
          cargo test --locked
      - name: Build and unit-test agent-launch
        working-directory: agent-launch
        run: |
          cargo fmt --check
          cargo build --release --locked
          cargo test --locked
      - name: Build and unit-test session-resume
        working-directory: session-resume
        run: |
          cargo fmt --check
          cargo build --release --locked
          cargo test --locked
      - name: Build and unit-test agent-sort
        working-directory: agent-sort
        run: |
          cargo fmt --check
          cargo build --release --locked
          cargo test --locked
      - name: Run plugin tests
        run: |
          set -e
          for t in */tests/*_test.sh; do
            echo "== $t"
            bash "$t"
          done
