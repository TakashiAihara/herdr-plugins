name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run plugin tests
        run: |
          set -e
          for t in */tests/*_test.sh; do
            echo "== $t"
            bash "$t"
          done
